<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OLX Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #141414;
      --surface:   #1f1f1f;
      --card:      #272727;
      --border:    #333;
      --accent:    #ff6500;
      --accent-dim:#c24d00;
      --text:      #e2e2e2;
      --muted:     #888;
      --radius:    10px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* ── Header ── */
    header {
      max-width: 960px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -.02em;
      color: var(--text);
    }
    header h1 span { color: var(--accent); }
    header .counter {
      margin-left: auto;
      font-size: .78rem;
      color: var(--muted);
    }

    /* ── Grid ── */
    #grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--surface);
      display: block;
    }
    .card-thumb.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-thumb.placeholder svg { opacity: .2; }

    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .card-title {
      font-size: .9rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc {
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-price {
      margin-top: auto;
      padding-top: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
    }
    .card-status {
      font-size: .72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }
    .card-status.loading::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border: 1.5px solid var(--muted);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .card-status.error { color: #e06060; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Card footer ── */
    .card-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .card-footer a {
      font-size: .75rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: .8;
      transition: opacity .15s;
    }
    /* stretch link — torna o card inteiro clicável sem JS */
    .card-footer a::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
    }
    .card-footer a:hover { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>OLX <span>Viewer</span></h1>
  <span class="counter" id="counter"></span>
</header>

<div id="grid"></div>



<script src="app.js"></script>
</body>
</html>
