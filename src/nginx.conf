server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos
    location / {
        try_files $uri $uri/ =404;
    }

    # Repassa /proxy?url=... para o servidor Node na porta 3000
    # proxy_pass com endereço fixo — sem variável, sem problema de resolver
    location /proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
